name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers the pinned aarch64-linux wgpu-native target.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DUNE_CACHE_ROOT: ${{ github.workspace }}/.dune-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore Dune compiler cache
        uses: actions/cache@v4
        with:
          path: .dune-cache/toolchains
          key: dune-toolchains-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dune-workspace', 'dune.lock/**', 'flake.nix', 'flake.lock') }}
      - uses: cachix/install-nix-action@v30
      - run: nix develop .#test -c dune build @check
      - name: Vulkan environment diagnostics (Linux)
        if: runner.os == 'Linux'
        run: |
          nix develop .#test -c sh -c '
            echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
            ls -la "$(dirname "$VK_DRIVER_FILES")" || true
            cat "$VK_DRIVER_FILES" || true
            vulkaninfo --summary 2>&1 | grep -A4 "GPU0" || true
            VK_LOADER_DEBUG=driver,error dune exec packages/opentui-wgpu/test/test_wgpu_headless.exe 2>&1 | grep -iE "lvp|lavapipe|icd|loader|validation|adapter|skip" | head -40 || true
          '
      - run: nix develop .#test -c dune runtest
      - name: Loader audit (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -l _build/default/packages/opentui-wgpu/test/test_wgpu_headless.exe \
            | grep -A2 LC_RPATH | grep "path.*wgpu-native"
          otool -L _build/default/packages/opentui-wgpu/test/test_wgpu_headless.exe \
            | grep "@rpath/libwgpu_native.dylib"
      - name: Loader audit (Linux)
        if: runner.os == 'Linux'
        run: |
          readelf -d _build/default/packages/opentui-wgpu/test/test_wgpu_headless.exe \
            | grep -E "RPATH|RUNPATH" | grep wgpu-native
